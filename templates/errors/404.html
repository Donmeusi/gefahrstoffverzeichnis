{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center">
        <div class="card glass-card shadow-lg p-5">
            <h1 class="display-1 text-primary mb-0" style="font-weight: 800; font-size: 6rem;">404</h1>
            <h2 class="text-secondary mb-4">Seite nicht gefunden</h2>
            <p class="text-muted mb-4">
                Die von Ihnen gesuchte Seite existiert nicht (mehr) oder der Link ist ungültig.
            </p>
            <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4 py-2">
                <i class="bi bi-house-door me-2"></i>Zurück zum Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
