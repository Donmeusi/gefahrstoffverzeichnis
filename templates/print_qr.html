<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code - {{ unterbereich.name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .print-container {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .app-title {
            font-size: 0.875rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .location-path {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2rem;
            line-height: 1.3;
        }

        .location-path span {
            color: #3b82f6; /* Primary color */
        }

        .qr-wrapper {
            background: white;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.75rem;
            display: inline-block;
            margin-bottom: 2rem;
        }

        .qr-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 250px;
            height: 250px;
        }

        .instructions {
            font-size: 0.875rem;
            color: #475569;
            margin-bottom: 2rem;
        }

        .btn-print {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Inter', sans-serif;
        }

        .btn-print:hover {
            background-color: #2563eb;
        }

        /* Print Specific Styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .print-container {
                box-shadow: none;
                padding: 0;
                margin: 0 auto;
                max-width: 100%;
            }
            .btn-print {
                display: none;
            }
            .qr-wrapper {
                border: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="print-container">
        <div class="app-title"><i class="fa-solid fa-flask"></i> Gefahrstoff-Inventar</div>
        <div class="location-path">
            {{ unterbereich.bereich.name }}<br>
            <span>{{ unterbereich.name }}</span>
        </div>
        
        <div class="qr-wrapper">
            <img src="data:image/png;base64,{{ qr_code_b64 }}" alt="QR Code für {{ unterbereich.name }}">
        </div>

        <div class="instructions">
            Scannen Sie diesen Code mit der Smartphone-Kamera, um direkt zum Inventar dieses Standorts zu gelangen.
        </div>

        <button class="btn-print" onclick="window.print()">
            <i class="fa-solid fa-print"></i> Jetzt Drucken
        </button>
    </div>

</body>
</html>
